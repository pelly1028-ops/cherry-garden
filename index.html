<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cherry Garden English</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  color:#554a63;
  background:linear-gradient(180deg,#fff7fb,#f4efff);
  min-height:100vh;
}

header{
  text-align:center;
  padding:42px 18px 24px;
}

.stars{
  font-size:42px;
  letter-spacing:6px;
}

h1{
  color:#cf6088;
  margin:12px 0 6px;
  font-size:32px;
}

.subtitle{
  color:#806f91;
  font-size:17px;
}

.container{
  width:91%;
  max-width:650px;
  margin:auto;
  padding-bottom:40px;
}

.card{
  background:white;
  border-radius:24px;
  padding:21px;
  margin:16px 0;
  box-shadow:0 7px 22px rgba(100,80,125,.12);
}

h2{
  margin-top:0;
  color:#705d83;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu button,.pinkButton{
  border:0;
  border-radius:18px;
  padding:16px 8px;
  font-size:16px;
  background:#fff0f5;
  color:#694f63;
  cursor:pointer;
}

.menu button:active,.pinkButton:active{
  transform:scale(.97);
}

#wordGarden{
  display:none;
}

.word{
  font-size:38px;
  font-weight:bold;
  color:#d45d82;
  text-align:center;
  margin:12px 0;
}

.picture{
  text-align:center;
  font-size:70px;
  background:#fff8dc;
  border-radius:22px;
  padding:20px;
}

.sound{
  display:block;
  margin:15px auto;
  border:0;
  border-radius:22px;
  padding:12px 22px;
  background:#eee5ff;
  color:#5d4b73;
  font-size:17px;
}

.story{
  background:#fff7df;
  border-radius:17px;
  padding:16px;
  line-height:1.8;
}

  border-radius:16px;
